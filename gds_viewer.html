<script>
const s=document.getElementById('s');
function setVB(x,y,w,h){s.setAttribute('viewBox',x+' '+y+' '+w+' '+h);}
function view(x0,x1,yc){const w=x1-x0;const h=w*0.55;setVB(x0,-yc-h/2,w,h);}
s.addEventListener('wheel',e=>{e.preventDefault();
 const vb=s.getAttribute('viewBox').split(' ').map(Number);
 const k=e.deltaY>0?1.25:0.8;
 const r=s.getBoundingClientRect();
 const mx=vb[0]+vb[2]*(e.clientX-r.left)/r.width;
 const my=vb[1]+vb[3]*(e.clientY-r.top)/r.height;
 setVB(mx-(mx-vb[0])*k, my-(my-vb[1])*k, vb[2]*k, vb[3]*k);});
let drag=null;
s.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];s.setPointerCapture(e.pointerId);});
s.addEventListener('pointermove',e=>{if(!drag)return;
 const vb=s.getAttribute('viewBox').split(' ').map(Number);
 const r=s.getBoundingClientRect();
 setVB(vb[0]-(e.clientX-drag[0])*vb[2]/r.width, vb[1]-(e.clientY-drag[1])*vb[3]/r.height, vb[2], vb[3]);
 drag=[e.clientX,e.clientY];});
s.addEventListener('pointerup',()=>drag=null);
</script></body></html>
